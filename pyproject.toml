[project]
name = "garmin-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niklas von Maltzahn", email = "niklasvm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "garmin-connect-personal-api-python>=1.0.0",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "playwright>=1.64.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "typer>=0.27.3",
]

[project.scripts]
garmin-api = "garmin_api.explore:main"
explore = "garmin_api.explore:explore"
report = "garmin_api.report:report"
message = "garmin_api.message:message_cli"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
